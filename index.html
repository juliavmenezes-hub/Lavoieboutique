    <style>
        :root {
            --bg-principal: #FFFFFF;
            --bg-suave: #FFF9FA;
            --rosa-bebe: #FAD0EC;
            --rosa-destaque: #E898B6;
            --rosa-hover: #D883A3;
            --marrom-suave: #4A3B37;
            --cinza-texto: #6B5E5B;
            --borda-suave: #F3E2E6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--cinza-texto);
            line-height: 1.6;
        }

        h1, h2, h3, h4 {
            font-family: 'Cormorant Garamond', serif;
            color: var(--marrom-suave);
            letter-spacing: 1px;
        }

        /* Cabeçalho Sticky */
        header {
            background-color: var(--bg-principal);
            border-bottom: 1px solid var(--borda-suave);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--marrom-suave);
            text-decoration: none;
        }

        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: var(--marrom-suave);
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--rosa-destaque);
        }

        /* Botão Rosa Principal */
        .btn-rosa {
            display: inline-block;
            background-color: var(--rosa-destaque);
            color: #FFFFFF;
            padding: 14px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(232, 152, 182, 0.3);
        }

        .btn-rosa:hover {
            background-color: var(--rosa-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(232, 152, 182, 0.4);
        }

        /* Hero / Capa */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 60px 5%;
            background-color: var(--bg-suave);
            min-height: 80vh;
        }

        .hero-text {
            max-width: 50%;
        }

        .hero-text h1 {
            font-size: 3.5rem;
            line-height: 1.1;
            margin-bottom: 15px;
        }

        .hero-text p.subtitulo {
            font-size: 1.3rem;
            font-style: italic;
            color: var(--rosa-destaque);
            margin-bottom: 30px;
            font-family: 'Cormorant Garamond', serif;
        }

        .hero-image {
            max-width: 45%;
            text-align: center;
        }

        .hero-image img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        /* Detalhes do Produto */
        .produto {
            padding: 80px 5%;
            display: flex;
            gap: 50px;
            align-items: center;
        }

        .produto-galeria {
            flex: 1;
            display: flex;
            gap: 15px;
        }

        .produto-galeria img {
            width: 50%;
            height: auto;
            border-radius: 8px;
            object-fit: cover;
        }

        .produto-info {
            flex: 1;
        }

        .produto-info h2 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .preco {
            font-size: 2.2rem;
            color: var(--marrom-suave);
            font-weight: 700;
            margin: 15px 0 5px 0;
        }

        .parcelamento {
            font-size: 0.95rem;
            color: var(--rosa-destaque);
            font-weight: 500;
            margin-bottom: 25px;
        }

        .detalhes-lista {
            list-style: none;
            margin-bottom: 30px;
        }

        .detalhes-lista li {
            padding: 8px 0;
            border-bottom: 1px solid var(--borda-suave);
            font-size: 0.95rem;
        }

        .detalhes-lista strong {
            color: var(--marrom-suave);
        }

        .tamanhos {
