<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lavoie Boutique - index.html</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #FAD0D3;
            --text-color: #333333;
            --soft-brown: #555555;
            --background-white: #FFFFFF;
            --border-color: #EEEEEE;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--text-color);
            background-color: var(--background-white);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
            color: #000;
            margin: 0;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-logo-group {
            display: flex;
            align-items: center;
        }

        .header-logo h1 {
            font-size: 28px;
            margin-right: 20px;
        }

        .header-slogan p {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 14px;
            color: #777;
            margin: 0;
        }

        .header-nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 20px;
        }

        .header-nav a {
            font-size: 14px;
            color: #000;
        }

        .hero {
            padding: 80px 0;
        }

        .hero-content {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .hero-text {
            flex: 1;
        }

        .hero-image {
            flex: 1;
        }

        .product {
            padding: 80px 0;
        }

        .product-content {
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        .product-gallery {
            flex: 2;
            display: flex;
            gap: 20px;
        }

        .product-details {
            flex: 1;
        }

        .product-title {
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 32px;
            font-weight: 700;
            color: #000;
            margin: 20px 0;
        }

        .buy-button {
            display: inline-block;
            background-color: var(--primary-pink);
            color: #000;
            padding: 15px 30px;
            border-radius: 5px;
            font-weight: 700;
            font-size: 16px;
            margin-top: 30px;
        }

        .gallery-sizes {
            padding: 80px 0;
            text-align: center;
        }

        .gallery-title {
            color: var(--primary-pink);
            font-size: 24px;
            margin-bottom: 40px;
        }

        .sizes-title {
            color: #000;
            margin: 60px 0 40px;
        }
